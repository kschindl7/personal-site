<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KyleGPT</title>
  <meta name="description" content="Kyle's personal site. Ask something about Kyle, or skip straight to the plain résumé.">
  <meta name="theme-color" content="#212121">
  <script>
    // Old links to the plain page (/?view=page) still work.
    if (new URLSearchParams(location.search).get('view') === 'page') location.replace('tavern/?view=page' + location.hash);
  </script>
  <link rel="stylesheet" href="kylegpt/style.css">
</head>
<body>
  <a class="skip-pill" href="tavern/?view=page">Skip to plain résumé</a>

  <div class="app" id="app">
    <main class="main">
      <header class="topbar">
        <span class="model">KyleGPT
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
        </span>
      </header>

      <div class="center">
        <h1 class="greet">What do you want to know about Kyle?</h1>

        <form class="composer-wrap" id="composer-wrap" autocomplete="off">
          <label class="sr-only" for="prompt">Ask something about Kyle</label>
          <div class="composer">
            <textarea id="prompt" rows="1" placeholder="Ask something about Kyle" spellcheck="false"></textarea>
            <button class="send" id="send" type="submit" aria-label="Send" disabled>
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
          </div>
        </form>

        <div class="chips" id="chips">
          <button type="button" class="chip">What does Kyle do?</button>
          <button type="button" class="chip">Where has Kyle worked?</button>
          <button type="button" class="chip">What is Kyle into?</button>
        </div>
      </div>

      <p class="disclaimer">KyleGPT can make mistakes. Check important info with Kyle.</p>
    </main>
  </div>

  <canvas id="glass-hole" class="fx" aria-hidden="true"></canvas>
  <canvas id="glass-shards" class="fx" aria-hidden="true"></canvas>
  <canvas id="glass-crack" class="fx" aria-hidden="true"></canvas>

  <!-- Forms out of the rain once the screen is gone (kylegpt/menu.js). -->
  <nav class="rain-menu" id="rain-menu" aria-label="Sections" hidden>
    <p class="rain-head" aria-hidden="true">kyle/</p>
    <a href="tavern/?view=page#about" data-section="about">about</a>
    <a href="tavern/?view=page#work" data-section="work">work</a>
    <a href="tavern/?view=page#interests" data-section="interests">interests</a>
    <a href="tavern/?view=page">résumé</a>
    <!-- Small and dim in the bottom-right corner; it lights up when found. -->
    <a href="tavern/?view=page#other" data-section="other" class="rain-egg">other?</a>
  </nav>

  <!-- A section, in a clear column the rain parts around (kylegpt/section.js). -->
  <article class="rain-page" id="rain-page" aria-labelledby="rain-title" hidden>
    <header class="rain-page-head">
      <h1 class="rain-title" id="rain-title" tabindex="-1"><span class="rain-crumb">kyle/</span><span class="rain-name"></span></h1>
      <button type="button" class="rain-back">Back</button>
    </header>
    <div class="rain-page-body"></div>
    <p class="rain-page-foot"><a class="rain-plain" href="tavern/?view=page">Open this as a plain page</a></p>
  </article>

  <button type="button" class="reset-btn" id="reset" hidden>Put the glass back</button>

  <noscript><p class="noscript">KyleGPT needs JavaScript. <a href="tavern/?view=page">Read the plain résumé</a> instead.</p></noscript>

  <script src="kylegpt/matrix.js"></script>
  <script src="kylegpt/glass.js"></script>
  <script src="kylegpt/codeword.js"></script>
  <script src="kylegpt/runs.js"></script>
  <script src="kylegpt/section.js"></script>
  <script src="kylegpt/menu.js"></script>
  <script src="kylegpt/main.js"></script>
</body>
</html>
